<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>WhaPa Token Helper</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      background: #111B21;
      color: #E9EDEF;
    }
    .header {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #1F2C34;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #25D366;
    }
    .subtitle {
      font-size: 11px;
      color: #8696A0;
      margin-top: 2px;
    }
    .status-box {
      background: #202C33;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #2A3942;
    }
    .status-text {
      font-size: 12px;
      color: #8696A0;
      line-height: 1.4;
      word-break: break-word;
    }
    .token-preview {
      display: none;
      margin-top: 8px;
      font-family: Consolas, monospace;
      font-size: 11px;
      color: #25D366;
      background: #0B141A;
      padding: 6px;
      border-radius: 6px;
      max-height: 50px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #25D366;
      border: none;
      border-radius: 8px;
      color: #0B141A;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover:not(:disabled) {
      background: #1EBE5D;
    }
    button:disabled {
      background: #202C33;
      color: #8696A0;
      cursor: not-allowed;
      border: 1px solid #2A3942;
    }
    .footer {
      margin-top: 10px;
      font-size: 11px;
      color: #8696A0;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div class="title">💬 WhaPa Token Helper</div>
      <div class="subtitle">Rilevamento oauth_token Google</div>
    </div>
  </div>

  <div class="status-box">
    <div id="status" class="status-text">Ricerca token in corso...</div>
    <div id="tokenPreview" class="token-preview"></div>
  </div>

  <button id="btnCopy" disabled>📋 Copia Token</button>

  <div class="footer">
    Incolla il valore in WhaPa nel campo Token
  </div>

  <script src="popup.js"></script>
</body>
</html>
